name: "AI Compliance — Promptfoo"

on:
  pull_request:
    paths:
      - "workflows/**"
      - "prompts/**"
      - "ui/multi_workflow_ui.py"

jobs:
  promptfoo:
    name: AI Behaviour Compliance Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write           # required for Workload Identity Federation
      pull-requests: write      # needed to post PR comment with results
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js (pre-installed on ubuntu-latest, pinned for stability) ──────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── Python env with project dependencies ──────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      # ── Google Cloud credentials via Workload Identity Federation ─────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ── Run Promptfoo evaluation ───────────────────────────────────────────
      - name: Run Promptfoo compliance tests
        id: promptfoo
        run: |
          npx --yes promptfoo@latest eval \
            --config prompts/promptfoo_config.yaml \
            --output promptfoo-results.json \
            --output-file promptfoo-report.html \
            --no-cache
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GCP_LOCATION }}
          PYTHONPATH: "."
          # Optional: Promptfoo cloud dashboard
          # PROMPTFOO_API_KEY: ${{ secrets.PROMPTFOO_API_KEY }}

      # ── Convert Promptfoo JSON → SARIF for GitHub Security tab ────────────
      - name: Convert results to SARIF
        if: always()
        run: python prompts/promptfoo_to_sarif.py promptfoo-results.json promptfoo.sarif

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: promptfoo.sarif
          category: promptfoo-ai-compliance

      # ── Upload HTML report and raw JSON as artifacts ───────────────────────
      - name: Upload Promptfoo artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promptfoo-results
          path: |
            promptfoo-results.json
            promptfoo-report.html
            promptfoo.sarif
          retention-days: 30

      # ── Post a readable summary comment to the PR ──────────────────────────
      - name: Post PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let results = {};
            try {
              results = JSON.parse(fs.readFileSync('promptfoo-results.json', 'utf8'));
            } catch (e) {
              console.log('Could not parse results:', e);
              return;
            }

            const stats = results.stats || {};
            const passed = stats.successes || 0;
            const failed = stats.failures || 0;
            const total  = passed + failed;
            const pct    = total > 0 ? Math.round((passed / total) * 100) : 0;
            const status = failed === 0 ? '✅ All tests passed' : `❌ ${failed} test(s) failed`;

            const body = [
              '## 🤖 Promptfoo AI Compliance Results',
              '',
              `**${status}** — ${passed}/${total} assertions passed (${pct}%)`,
              '',
              '| Metric | Value |',
              '|---|---|',
              `| Total tests | ${total} |`,
              `| Passed | ${passed} |`,
              `| Failed | ${failed} |`,
              `| Pass rate | ${pct}% |`,
              '',
              '📎 Full HTML report available in the [Actions artifacts](' +
                `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
