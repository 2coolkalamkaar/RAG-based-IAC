name: "SAST — Semgrep"

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  semgrep:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required for SARIF upload
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          # Community rule packs — no account required
          config: >-
            p/python
            p/security-audit
            p/secrets
            p/subprocess
          # Emit SARIF for GitHub Security tab integration
          sarif_output: semgrep.sarif
          # Fail only on ERROR-level findings (not WARNING/INFO)
          generateSarif: "1"
        env:
          # Set to empty string to run fully offline with community rules
          SEMGREP_APP_TOKEN: ""

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

      - name: Upload SARIF as Artifact (fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30
